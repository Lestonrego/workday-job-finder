name: Scheduled Workday Job Scan

on:
  schedule:
    - cron: "30 18 * * *"   # 12:00 AM IST
    - cron: "30 6 * * *"    # 12:00 PM IST
  workflow_dispatch:          # optional manual "Run workflow" button

concurrency:
  group: job-scan
  cancel-in-progress: false  # never start a second scan while one is still running

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore site list cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: sites-cache-${{ github.run_id }}
          restore-keys: sites-cache-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job scanner
        run: python scanner.py
        env:
          PYTHONUNBUFFERED: "1"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}   # optional: extra keys from other accounts, comma separated
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MAX_JOBS_PER_SITE: "300"
          MAX_DISCOVERED_SITES: "20000"
          RUN_BUDGET_MIN: "60"